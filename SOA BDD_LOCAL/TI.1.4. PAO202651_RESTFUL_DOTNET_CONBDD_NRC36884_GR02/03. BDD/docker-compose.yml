# EurekaBank - SQL Server 2022 local (TI .NET del GR02)
# Uso (el archivo .env con las claves del grupo ya esta incluido):
#       docker compose up -d
# El servicio "init" crea y carga la base solo si EUREKABANK no existe.
# Para recrear la base desde cero:  docker compose down -v && docker compose up -d

name: eurekabank-sqlserver

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eurekabank-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en el archivo .env}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - eurekabank-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eurekabank-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./Crea_BD.sql:/scripts/01_Crea_BD.sql:ro
      - ./Carga_Datos.sql:/scripts/02_Carga_Datos.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P $$MSSQL_SA_PASSWORD -C -b"
        EXISTE=$$($$SQLCMD -h -1 -W -Q "SET NOCOUNT ON; SELECT CASE WHEN DB_ID('EUREKABANK') IS NULL THEN 0 ELSE 1 END")
        if [ "$$EXISTE" = "1" ]; then
          echo "EUREKABANK ya existe: no se ejecutan los scripts."
        else
          $$SQLCMD -i /scripts/01_Crea_BD.sql && $$SQLCMD -i /scripts/02_Carga_Datos.sql && echo "EUREKABANK creada y cargada."
        fi
    restart: "no"

volumes:
  eurekabank-sqlserver-data:
