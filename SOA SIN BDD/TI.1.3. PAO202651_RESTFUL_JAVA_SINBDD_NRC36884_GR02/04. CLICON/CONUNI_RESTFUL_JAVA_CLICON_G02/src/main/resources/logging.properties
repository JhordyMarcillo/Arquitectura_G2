# Configuración de logging para Jersey Client
# Oculta completamente los mensajes de advertencia de Jersey

# Desactivar todos los loggers de Jersey
org.glassfish.jersey.level=SEVERE
org.glassfish.jersey.client.level=SEVERE
org.glassfish.jersey.client.innate.inject.NonInjectionManager.level=SEVERE
org.glassfish.jersey.message.internal.MessagingBinders.level=SEVERE
org.glassfish.jersey.message.internal.level=SEVERE
jakarta.activation.level=SEVERE

# Configurar el nivel general de logging - solo mostrar errores severos
.level=SEVERE
rootLogger.level=SEVERE

# Configurar el handler de consola para solo mostrar SEVERE
java.util.logging.ConsoleHandler.level=SEVERE
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# Configurar el formato de logging (minimalista)
java.util.logging.SimpleFormatter.format=%4$s: %5$s%n

# Desactivar específicamente los warnings de Jersey
handlers=java.util.logging.ConsoleHandler
